
name: Build XorPlay Modern

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkita64:latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install tools
        run: |
          apt-get update
          apt-get install -y curl zip unzip

      - name: Extract source
        run: |
          unzip -o XorPlay-Modern-source.zip

      - name: Fetch dependencies
        run: |
          cd XorPlay-Modern
          chmod +x fetch-deps.sh
          ./fetch-deps.sh

      - name: Build
        run: |
          cd XorPlay-Modern
          make -j$(nproc)

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: XorPlay-Modern
          path: XorPlay-Modern/XorPlay-Modern.zip
          

name: Build XorPlay-Modern

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkita64:latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          if [ -f fetch-deps.sh ]; then
            chmod +x fetch-deps.sh
            ./fetch-deps.sh
          fi

      - name: Compile sysmodule and control
        run: |
          make -C sysmodule
          make -C control

      - name: Package files
        run: |
          mkdir -p salida/atmosphere/contents/00FF0000A0F1A001/flags
          mkdir -p salida/switch
          mkdir -p salida/config/xorplay
          mkdir -p salida/music

          cp sysmodule/*.nsp salida/atmosphere/contents/00FF0000A0F1A001/exefs.nsp
          touch salida/atmosphere/contents/00FF0000A0F1A001/flags/boot2.flag
          cp control/*.nro salida/switch/
          cp -r config/* salida/config/xorplay/ || true
          cp -r music/* salida/music/ || true

      - name: Upload compiled artifacts
        uses: actions/upload-artifact@v4
        with:
          name: XorPlay-Modern-Compiled
          path: salida/
          
          

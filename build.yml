name: Build XorPlay Modern

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkita64:latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install fetch tools
        run: |
          apt-get update
          apt-get install -y curl zip

      - name: Fetch audio decoder dependencies
        run: chmod +x fetch-deps.sh && ./fetch-deps.sh

      - name: Build
        run: make -j$(nproc)

      - name: Upload release ZIP
        uses: actions/upload-artifact@v4
        with:
          name: XorPlay-Modern
          path: XorPlay-Modern.zip
